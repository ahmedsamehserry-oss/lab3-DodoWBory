{% extends 'base.html' %}
{% block title %}Create account{% endblock %}
{% block content %}
<section class="panel auth">
  <h1>Create account</h1><p class="muted">Start organizing your tasks.</p>
  {% if errors %}<div class="notice error" role="alert">{% for error in errors %}<div>{{ error }}</div>{% endfor %}</div>{% endif %}
  <div id="client-errors" class="notice error hidden" role="alert"></div>
  <form method="post" action="{{ url_for('register') }}" novalidate data-check="register">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Name <input name="name" autocomplete="name" maxlength="100" value="{{ values.name }}"></label>
    <label>Email <input name="email" type="email" autocomplete="email" maxlength="255" value="{{ values.email }}"></label>
    <label>Password <input name="password" type="password" autocomplete="new-password"></label>
    <label>Confirm password <input name="confirm_password" type="password" autocomplete="new-password"></label>
    <button type="submit" class="primary full">Register</button>
  </form>
  <p class="footer-text">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</section>
{% endblock %}

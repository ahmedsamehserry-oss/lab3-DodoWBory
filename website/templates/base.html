<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}My To-Do{% endblock %} · Lab 3</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script defer src="{{ url_for('static', filename='app.js') }}"></script>
</head>
<body>
  <main class="container">
    <header class="brand"><span class="brand-icon">✓</span> <span>My To-Do + Library <small>Database Lab 3</small></span></header>
    {% if session.get('user_id') %}
    <nav class="main-nav" aria-label="Main navigation">
      <a href="{{ url_for('todos') }}">✓ My tasks</a>
      <a href="{{ url_for('library') }}">📚 Library</a>
      <form method="post" action="{{ url_for('logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit" class="secondary tiny">Log out</button>
      </form>
    </nav>
    {% endif %}
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="notice {{ category }}" role="status">{{ message }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
